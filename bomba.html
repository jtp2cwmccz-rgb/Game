<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Bomba: Cuenta Atrás</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<style>
  :root{
    --bg-1:#05060a;
    --bg-2:#0c1020;
    --steel-1:#3a3f4b;
    --steel-2:#181a20;
    --steel-hi:#8a91a0;
    --red:#ff2f3a;
    --amber:#ffb020;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg-1) 70%);
    overflow:hidden;
    font-family:'Courier New', 'Segoe UI Mono', monospace;
  }

  #stars{
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #ffffff88 1px, transparent 1px),
      radial-gradient(1px 1px at 80% 10%, #ffffff66 1px, transparent 1px),
      radial-gradient(1px 1px at 60% 70%, #ffffffaa 1px, transparent 1px),
      radial-gradient(1px 1px at 30% 80%, #ffffff55 1px, transparent 1px),
      radial-gradient(1px 1px at 90% 60%, #ffffff77 1px, transparent 1px),
      radial-gradient(1px 1px at 45% 40%, #ffffff44 1px, transparent 1px),
      radial-gradient(1px 1px at 20% 55%, #ffffff66 1px, transparent 1px),
      radial-gradient(1px 1px at 70% 85%, #ffffff55 1px, transparent 1px);
    background-repeat:repeat;
    background-size:400px 400px;
    opacity:.8;
    pointer-events:none;
    z-index:0;
    transition:opacity .6s ease;
  }

  #scene{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    z-index:1;
  }

  .title{
    color:#7d8699;
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    margin:0 0 -6px;
  }

  /* ---------- Timer readout ---------- */
  .readout{
    position:relative;
    padding:10px 26px;
    border-radius:10px;
    background:linear-gradient(180deg,#151821,#0a0c12);
    border:2px solid #262b38;
    box-shadow:inset 0 0 12px #000, 0 0 0 1px #00000080;
  }
  .readout-digits{
    font-size:48px;
    font-weight:700;
    letter-spacing:4px;
    color:var(--red);
    text-shadow:0 0 8px var(--red), 0 0 22px #ff000066;
    font-variant-numeric:tabular-nums;
    transition:color .2s;
  }
  .readout-digits.neg{
    color:#ff5f5f;
    animation:blinkFast .35s steps(2,start) infinite;
  }
  @keyframes blinkFast{ 50%{ opacity:.25; } }

  /* ---------- Bomb ---------- */
  #bomb-wrap{
    position:relative;
    width:260px;
    height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #bomb{
    position:relative;
    width:190px;
    height:190px;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, var(--steel-hi) 0%, var(--steel-1) 22%, var(--steel-2) 62%, #050608 100%);
    box-shadow:
      inset -14px -14px 30px #000000cc,
      inset 10px 10px 18px #ffffff22,
      0 18px 40px #000000aa;
    transition:transform .08s ease;
  }
  #bomb::after{
    /* rivet ring */
    content:"";
    position:absolute;
    inset:14px;
    border-radius:50%;
    border:2px dashed #00000055;
    opacity:.5;
  }
  .cap{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:46px;
    height:26px;
    border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg,#585f6e,#22252d);
    box-shadow:inset 0 -4px 6px #00000090, 0 2px 4px #00000080;
  }
  .fuse{
    position:absolute;
    top:-58px;
    left:50%;
    width:10px;
    height:52px;
    transform-origin:bottom center;
    transform:translateX(-50%) rotate(8deg);
  }
  .fuse-rope{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(45deg,#8a6a3d,#8a6a3d 3px,#5c4526 3px,#5c4526 6px);
    border-radius:6px;
    box-shadow:0 0 4px #00000070;
  }
  .spark{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:22px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(circle, #fff5c0 0%, var(--amber) 35%, var(--red) 70%, transparent 75%);
    box-shadow:0 0 14px 6px #ff8a2a, 0 0 26px 12px #ff2f0044;
    animation:flicker .12s infinite alternate;
  }
  @keyframes flicker{
    0%{ transform:translateX(-50%) scale(1) rotate(-4deg); }
    100%{ transform:translateX(-50%) scale(1.18) rotate(4deg); }
  }

  .glint{
    position:absolute;
    top:26%;
    left:24%;
    width:34px;
    height:20px;
    border-radius:50%;
    background:#ffffff55;
    filter:blur(3px);
    transform:rotate(-25deg);
  }

  /* shaking as it gets urgent */
  .shake-slow{ animation:shake .5s infinite; }
  .shake-fast{ animation:shake .12s infinite; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(-3px,2px) rotate(-1deg); }
    50%{ transform:translate(3px,-2px) rotate(1deg); }
    75%{ transform:translate(-2px,-3px) rotate(-1deg); }
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    gap:14px;
  }
  button.btn{
    font-family:inherit;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#eef;
    background:linear-gradient(180deg,#2a2f3d,#171a22);
    border:1px solid #3a4054;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 4px 0 #05060a, 0 6px 14px #00000066;
  }
  button.btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #05060a;
  }
  button.btn.primary{
    color:#00140a;
    background:linear-gradient(180deg,#5ef2a0,#20b866);
    border-color:#1f7a4a;
  }
  button.btn[disabled]{
    opacity:.35;
    cursor:not-allowed;
  }
  .hint{
    color:#5b6376;
    font-size:12px;
    letter-spacing:.05em;
    text-align:center;
    max-width:280px;
  }

  /* ---------- Explosion particles / shockwaves ---------- */
  .particle{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:5;
    will-change:transform,opacity;
  }
  .shockwave{
    position:fixed;
    top:50%;
    left:50%;
    width:40px;
    height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    border:4px solid #ffd98a;
    box-shadow:0 0 30px 10px #ff9a2a88;
    pointer-events:none;
    z-index:4;
    opacity:0;
  }
  .shockwave.go{
    animation:shockwave 1.1s cubic-bezier(.1,.6,.3,1) forwards;
  }
  @keyframes shockwave{
    0%{ opacity:.95; transform:scale(0); }
    100%{ opacity:0; transform:scale(38); }
  }

  #flash{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 55%, #fff, #fff6d8 35%, #ff8a2a 65%, #2a0800 100%);
    opacity:0;
    z-index:6;
    pointer-events:none;
  }
  #flash.go{
    animation:flashSeq 2.6s ease forwards;
  }
  @keyframes flashSeq{
    0%{ opacity:0; }
    8%{ opacity:1; }
    35%{ opacity:1; background:radial-gradient(circle at 50% 55%, #fff, #fff 40%, #ffe9b0 70%, #6a2a00 100%); }
    100%{ opacity:1; background:#ffffff; }
  }

  #bomb-wrap.exploding #bomb,
  #bomb-wrap.exploding .cap,
  #bomb-wrap.exploding .fuse{
    animation:none;
    opacity:0;
    transition:opacity .12s ease;
  }

  #whiteout{
    position:fixed;
    inset:0;
    background:#ffffff;
    opacity:0;
    z-index:7;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    pointer-events:none;
    transition:opacity .8s ease;
  }
  #whiteout.show{
    opacity:1;
    pointer-events:auto;
  }
  #whiteout h1{
    margin:0;
    font-family:inherit;
    letter-spacing:.3em;
    font-size:15px;
    color:#111;
    text-transform:uppercase;
  }
  #whiteout p{
    margin:0;
    color:#555;
    font-size:12px;
    letter-spacing:.08em;
  }
  #whiteout button.btn{
    color:#111;
    background:#fff;
    border:1px solid #ccc;
    box-shadow:0 4px 0 #ccc, 0 6px 14px #00000022;
  }

  .screen-shake{
    animation:screenShake .35s ease-in-out;
  }
  @keyframes screenShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-10px,6px); }
    40%{ transform:translate(9px,-7px); }
    60%{ transform:translate(-7px,-5px); }
    80%{ transform:translate(6px,8px); }
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="flash"></div>
<div id="whiteout">
  <h1>Todo es luz.</h1>
  <p>El diseño ha colapsado en el Big Bang.</p>
  <button class="btn primary" id="reset-btn">Reiniciar</button>
</div>

<div id="scene">
  <p class="title">Diseño experimental · unidad 01</p>

  <div class="readout">
    <span class="readout-digits" id="digits">10</span>
  </div>

  <div id="bomb-wrap">
    <div id="bomb">
      <div class="glint"></div>
      <div class="cap"></div>
      <div class="fuse">
        <div class="fuse-rope"></div>
        <div class="spark" id="spark"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" id="start-btn">Armar bomba</button>
    <button class="btn" id="stop-btn" disabled>Desactivar</button>
  </div>
  <p class="hint">La cuenta atrás empieza en 10 y sigue hasta -5, momento en el que el diseño explota hasta quedar todo en blanco.</p>
</div>

<script>
(function(){
  const START = 10;
  const EXPLODE_AT = -5;

  const digitsEl   = document.getElementById('digits');
  const bombWrap   = document.getElementById('bomb-wrap');
  const bomb       = document.getElementById('bomb');
  const spark      = document.getElementById('spark');
  const startBtn   = document.getElementById('start-btn');
  const stopBtn    = document.getElementById('stop-btn');
  const resetBtn   = document.getElementById('reset-btn');
  const flash      = document.getElementById('flash');
  const whiteout   = document.getElementById('whiteout');
  const stars      = document.getElementById('stars');

  let timeLeft = START;
  let timerId = null;
  let running = false;

  function render(){
    digitsEl.textContent = timeLeft;
    digitsEl.classList.toggle('neg', timeLeft < 0);

    bombWrap.classList.remove('shake-slow','shake-fast');
    if(timeLeft <= 3 && timeLeft > EXPLODE_AT){
      bombWrap.classList.add('shake-fast');
    } else if(timeLeft <= 6){
      bombWrap.classList.add('shake-slow');
    }
  }

  function tick(){
    timeLeft -= 1;
    if(timeLeft <= EXPLODE_AT){
      clearInterval(timerId);
      timerId = null;
      render();
      explode();
      return;
    }
    render();
  }

  function start(){
    if(running) return;
    running = true;
    timeLeft = START;
    render();
    startBtn.disabled = true;
    stopBtn.disabled = false;
    timerId = setInterval(tick, 1000);
  }

  function stop(){
    if(!running) return;
    clearInterval(timerId);
    timerId = null;
    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function spawnParticles(){
    const originRect = bomb.getBoundingClientRect();
    const cx = originRect.left + originRect.width/2;
    const cy = originRect.top + originRect.height/2;
    const colors = ['#fff5c0','#ffd35c','#ff9a2a','#ff5a1f','#ff2f2f','#ffffff'];
    const count = 90;

    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random()*14;
      p.style.width  = size+'px';
      p.style.height = size+'px';
      p.style.left = (cx - size/2)+'px';
      p.style.top  = (cy - size/2)+'px';
      const color = colors[Math.floor(Math.random()*colors.length)];
      p.style.background = color;
      p.style.boxShadow = '0 0 '+(size*1.5)+'px '+color;

      const angle = Math.random()*Math.PI*2;
      const dist  = 180 + Math.random()*520;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      const duration = 700 + Math.random()*700;

      document.body.appendChild(p);

      const anim = p.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:`translate(${dx}px, ${dy}px) scale(0.2)`, opacity:0 }
      ], { duration, easing:'cubic-bezier(.15,.6,.3,1)', fill:'forwards' });

      anim.onfinish = () => p.remove();
    }
  }

  function spawnShockwaves(){
    for(let i=0;i<3;i++){
      const s = document.createElement('div');
      s.className = 'shockwave';
      document.body.appendChild(s);
      setTimeout(()=>{
        s.classList.add('go');
        s.addEventListener('animationend', ()=> s.remove());
      }, i*120);
    }
  }

  function explode(){
    stopBtn.disabled = true;
    startBtn.disabled = true;

    bombWrap.classList.remove('shake-slow','shake-fast');
    bombWrap.classList.add('exploding');
    spark.style.display = 'none';

    document.body.classList.add('screen-shake');
    setTimeout(()=> document.body.classList.remove('screen-shake'), 350);

    spawnShockwaves();
    spawnParticles();

    flash.classList.add('go');
    stars.style.opacity = '0';

    setTimeout(()=>{
      whiteout.classList.add('show');
    }, 1900);
  }

  function reset(){
    clearInterval(timerId);
    timerId = null;
    running = false;
    timeLeft = START;

    document.querySelectorAll('.particle, .shockwave').forEach(el => el.remove());
    flash.classList.remove('go');
    flash.style.opacity = '';
    whiteout.classList.remove('show');
    stars.style.opacity = '.8';

    bombWrap.classList.remove('exploding','shake-slow','shake-fast');
    spark.style.display = '';

    startBtn.disabled = false;
    stopBtn.disabled = true;

    render();
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  resetBtn.addEventListener('click', reset);

  render();
})();
</script>
</body>
</html>
